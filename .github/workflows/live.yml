name: Live refresh (multi-asset)

# Rebuilds the multi-asset screener (prices, model, forecasts, signals) every 15 minutes, 24/7,
# so forex and crypto stay current through Asian hours and weekends. The main US day-trading
# page is carried over unchanged from the live site; it is still rebuilt only by "Daily screener".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep the main US screener page as currently published
        run: |
          mkdir -p site
          base="https://izadm1.github.io/us-screener"
          ok=1
          for f in index.html latest.html; do
            curl -fsSL --retry 3 "$base/$f" -o "site/$f" || ok=0
          done
          if [ "$ok" = "0" ]; then
            echo "Live copy unavailable - rebuilding main page without touching saved history"
            cp -r history /tmp/hist
            python us_screener.py --no-open --out site --history /tmp/hist
            cp site/latest.html site/index.html
          fi
      - name: Build multi-asset screener
        run: |
          python multi/scripts/build_data.py
          mkdir -p site/multi
          cp -r multi/index.html multi/app.js multi/live.js multi/style.css multi/vendor multi/data site/multi/
          touch site/.nojekyll
          sed -i "s/__V__/${GITHUB_RUN_ID}/g" site/multi/index.html
      - name: Save refreshed fundamentals cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi/data/fundamentals.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Fundamentals cache $(date -u +%F)"
            git pull --rebase -q origin main && git push || echo "push skipped"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
