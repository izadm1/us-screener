name: Daily screener

on:
  schedule:
    # Times are UTC. 12:45 = 20:45 Malaysia = before the US open all year.
    - cron: "45 12 * * 1-5"
    # Refresh every hour while the US market is open (≈ 22:15–05:15 Malaysia).
    - cron: "15 14-20 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["multi/**", ".github/workflows/screener.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screener
        run: |
          python us_screener.py --no-open --out site
          cp site/latest.html site/index.html
      - name: Build multi-asset screener (stocks, ETFs, indices, crypto)
        continue-on-error: true
        run: |
          python multi/scripts/build_data.py
          node multi/scripts/signals.mjs multi/data || echo "signals step failed"
          mkdir -p site/multi
          cp -r multi/*.html multi/*.js multi/*.css multi/vendor multi/data site/multi/
          touch site/.nojekyll
          sed -i "s/__V__/${GITHUB_RUN_ID}/g" site/multi/*.html
      - name: Save plan and results history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history; git add multi/data/fundamentals.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "History $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
