<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="build" content="__V__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Asset Screener — Stocks · ETFs · Indices · Crypto · Forex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__V__">
<script src="vendor/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <h1>Multi-Asset Screener</h1>
      <p class="sub">Stocks · ETFs · Indices · Crypto · Forex — <span id="updated">loading…</span></p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-cls="picks" class="pkTab">★ Top Picks</button>
    <button data-cls="stocks" class="on">Stocks</button>
    <button data-cls="etfs">ETFs</button>
    <button data-cls="indices">Indices</button>
    <button data-cls="crypto">Crypto</button>
    <button data-cls="forex">Forex</button>
    <button data-cls="method">Method</button>
  </nav>
</header>

<section class="regime" id="regime"></section>

<main id="screen">
  <section class="controls">
    <div class="fcbar">
      <div class="view" id="view"><button data-v="forecast" class="on">Forecast view</button><button data-v="tech">Technical view</button></div>
      <label>Forecast date <input id="fdate" type="date"></label>
      <div class="quick" id="quick"><button data-d="7">+1W</button><button data-d="14">+2W</button><button data-d="30">+1M</button><button data-d="91">+3M</button><button data-d="182">+6M</button></div>
    </div>
    <div class="presets" id="presets"></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search symbol or name">
      <label>Min score <input id="minScore" type="range" min="0" max="100" value="0"><b id="minScoreV">0</b></label>
      <label>RSI <input id="rsiMin" type="number" min="0" max="100" value="0"> – <input id="rsiMax" type="number" min="0" max="100" value="100"></label>
      <select id="sig"><option value="">Any signal</option></select>
      <label class="chk"><input id="upOnly" type="checkbox"> Above 200 EMA</label>
      <label class="chk"><input id="noExt" type="checkbox"> Hide overextended</label>
      <span class="count" id="count"></span>
    </div>
  </section>
  <section class="tv" id="tv" hidden>
    <div class="tvhead">
      <div><span class="tvsym" id="tvSym"></span> <span class="tvname" id="tvName"></span></div>
      <div class="ohlc" id="tvOhlc"></div>
      <div class="tvctl">
        <div class="quick" id="tvRange"><button data-r="63">3M</button><button data-r="126" class="on">6M</button><button data-r="252">1Y</button><button data-r="9999">All</button></div>
        <button class="tvbtn" id="tvDetails">Full details</button>
      </div>
    </div>
    <div class="legend" id="tvLegend"></div>
    <div id="tvMain" class="chart tvmain"></div>
    <div class="panelabel">Price cycle — <span id="tvCycInfo"></span></div>
    <div id="tvCyc" class="chart small"></div>
    <div class="panelabel">RSI (14)</div>
    <div id="tvRsi" class="chart small" style="height:100px"></div>
    <div class="levels" id="tvLevels"></div>
  </section>
  <div class="tablewrap">
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </div>
  <p class="foot">Scores are relative rankings for research, not buy/sell advice. Daily bars; intraday moves are not reflected until the next data refresh.</p>
</main>

<main id="picks" hidden></main>
<main id="method" hidden></main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-inner">
    <button class="close" id="closeDrawer" aria-label="Close">✕</button>
    <div id="dHead"></div>
    <div id="chart" class="chart"></div>
    <div id="rsiChart" class="chart small"></div>
    <div id="dBody"></div>
  </div>
</aside>

<script src="app.js?v=__V__"></script>
</body>
</html>
